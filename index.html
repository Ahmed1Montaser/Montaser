<!doctype html><html lang="ar" dir="rtl"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#F2F1FA" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0F0E26" media="(prefers-color-scheme: dark)"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ملعب اللغات"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"></head><body>
<title>ملعب اللغات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column. Home = stats, smart review, quick games, level ladder A0..B2.
   Game = one question per screen with a sticky feedback bar. Extra views: words, backup, race, match. */
:root{
  --bg:#F2F1FA; --surface:#FFFFFF; --ink:#1A1744; --muted:#65628F; --line:#DAD8F0;
  --accent:#4B4DED; --accent-deep:#3032B4; --accent-ink:#FFFFFF; --accent-soft:#E6E6FF;
  --warm:#E86F1C; --good:#0D9468; --good-deep:#0A6F4E; --good-ink:#FFFFFF; --good-soft:#D8F4E9;
  --bad:#D3303F; --bad-deep:#9B2230; --bad-ink:#FFFFFF; --bad-soft:#FFE2E5;
  --font-display:'Baloo Bhaijaan 2','Cairo',system-ui,sans-serif;
  --font-body:'Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F0E26; --surface:#1B1940; --ink:#EEEDFF; --muted:#9C9AC8; --line:#2E2C5E;
    --accent:#7C84FF; --accent-deep:#4B52D6; --accent-ink:#0F0E26; --accent-soft:#25235A;
    --warm:#FFA45E; --good:#35D3A2; --good-deep:#1E9C77; --good-ink:#07261C; --good-soft:#10382F;
    --bad:#FF6B78; --bad-deep:#C2414E; --bad-ink:#3A0A10; --bad-soft:#44202A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F0E26; --surface:#1B1940; --ink:#EEEDFF; --muted:#9C9AC8; --line:#2E2C5E;
  --accent:#7C84FF; --accent-deep:#4B52D6; --accent-ink:#0F0E26; --accent-soft:#25235A;
  --warm:#FFA45E; --good:#35D3A2; --good-deep:#1E9C77; --good-ink:#07261C; --good-soft:#10382F;
  --bad:#FF6B78; --bad-deep:#C2414E; --bad-ink:#3A0A10; --bad-soft:#44202A; color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--font-body)}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
.ltr{direction:ltr;unicode-bidi:isolate}
svg.i{width:1.25em;height:1.25em;flex:none;vertical-align:-0.2em}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font:800 1.7rem/1.2 var(--font-display)}
.brand p{margin:0;color:var(--muted);font-size:.9rem}
.seg{display:flex;gap:3px;padding:3px;background:var(--surface);border:2px solid var(--line);border-radius:14px}
.seg button{border:0;background:none;padding:6px 16px;border-radius:11px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
.stat{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0}
.stat b{font:800 1.35rem/1 var(--font-display);font-variant-numeric:tabular-nums;display:block}
.stat small{color:var(--muted);font-size:.78rem;display:block;line-height:1.3}
.stat .i{width:1.7em;height:1.7em}
.c-flame{color:var(--warm)} .c-xp{color:var(--accent)} .c-ok{color:var(--good)} .c-heart{color:var(--bad)}

/* review card */
.review{margin-top:16px;background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.review h2{margin:0;font:800 1.15rem/1.3 var(--font-display)}
.review p{margin:2px 0 0;opacity:.85;font-size:.9rem}
.review.idle{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.review.idle p{color:var(--muted);opacity:1}

/* buttons */
.btn{display:block;width:100%;font:700 1.1rem/1.2 var(--font-display);padding:13px 22px;border-radius:16px;border:0;border-bottom:5px solid var(--accent-deep);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.btn:disabled{background:var(--line);border-bottom-color:var(--line);color:var(--muted);cursor:not-allowed}
.btn.good{background:var(--good);border-bottom-color:var(--good-deep);color:var(--good-ink)}
.btn.bad{background:var(--bad);border-bottom-color:var(--bad-deep);color:var(--bad-ink)}
.btn.light{background:var(--accent-ink);color:var(--accent);border-bottom-color:rgba(0,0,0,.25);width:auto}
.btn.ghost{background:var(--surface);color:var(--accent);border:2px solid var(--line);border-bottom-width:5px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px}

/* sections */
.sec{margin:30px 0 0;font:800 1.2rem/1.3 var(--font-display)}
.level{margin-top:30px}
.lv-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lv-code{font:800 2.1rem/1 var(--font-display);color:var(--accent);direction:ltr}
.lv-name{font-weight:700}
.lv-prog{margin-inline-start:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.mini{width:84px;height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.mini i{display:block;height:100%;background:var(--good)}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
.unit{text-align:start;display:flex;flex-direction:column;gap:4px;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:12px 14px;cursor:pointer;min-width:0}
.unit:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.unit strong{font:700 1.05rem/1.3 var(--font-display)}
.unit span{color:var(--muted);font-size:.82rem}
.unit .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.unit.done{border-color:var(--good)}
.unit.locked,.unit:disabled{opacity:.55;cursor:not-allowed}
.unit .go{color:var(--accent);font-weight:700;font-size:.85rem}
.gt .row .i{width:1.5em;height:1.5em;color:var(--accent)}
.foot{margin-top:28px;display:flex;flex-direction:column;align-items:center;gap:2px}
.foot small{color:var(--muted)}

/* game */
.gtop{display:flex;align-items:center;gap:12px}
.gtop .x,.gtop .snd{background:none;border:0;cursor:pointer;color:var(--muted);padding:4px;display:flex}
.gtop .i{width:1.6em;height:1.6em}
.gtop h2{margin:0;font:800 1.3rem var(--font-display)}
.bar{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.hearts{display:flex;align-items:center;gap:4px;color:var(--bad);font:800 1.1rem var(--font-display);font-variant-numeric:tabular-nums}
.monrow{display:flex;align-items:center;gap:14px;margin-top:14px}
.mon svg{width:76px;height:76px;display:block}
.hp{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.hp i{display:block;height:100%;background:var(--bad);border-radius:99px;transition:width .35s}
.mon.hit{animation:hit .45s}
.mon.bite{animation:bite .45s}
@keyframes hit{0%{transform:scale(1)}30%{transform:scale(.8) rotate(-8deg)}60%{transform:scale(1.06) rotate(5deg)}100%{transform:scale(1)}}
@keyframes bite{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.stage{min-height:62vh;display:flex;flex-direction:column;gap:14px;padding-block:22px 24px}
.tag{align-self:flex-start;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.8rem;padding:2px 12px;border-radius:99px}
.prompt{margin:0;font:700 1.3rem/1.4 var(--font-display)}
.wordcard{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:22px 16px;text-align:center}
.word{font:800 2.2rem/1.25 var(--font-display);direction:ltr;overflow-wrap:anywhere;min-width:0}
.word.ar{direction:rtl;font-size:1.9rem}
.word.sm{font-size:1.7rem}
.word b{color:var(--good)}
.blank{display:inline-block;min-width:3.2ch;border-bottom:4px solid var(--accent);vertical-align:baseline;margin-inline:2px}
.big .word{font-size:2.8rem}
.meaning{margin:0;text-align:center;font:700 1.5rem/1.4 var(--font-display);color:var(--muted)}
.note{background:var(--accent-soft);border-radius:20px;padding:20px;font-size:1.1rem;line-height:1.8}
.spk{background:var(--accent-soft);color:var(--accent);border:0;border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.spk .i{width:1.5em;height:1.5em}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:13px 14px;font-size:1.08rem;font-weight:600;cursor:pointer;text-align:center;overflow-wrap:anywhere}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.field{width:100%;font:600 1.35rem var(--font-body);padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);direction:ltr;text-align:start}
.field.area{font:500 .8rem/1.4 ui-monospace,Menlo,Consolas,monospace;min-height:110px;resize:vertical;word-break:break-all}
.accs{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.accs button{min-width:42px;padding:6px 10px;border-radius:10px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);font:700 1.05rem var(--font-body);cursor:pointer}
.slots{display:flex;flex-wrap:wrap;gap:8px;min-height:64px;padding:10px;border:2px dashed var(--line);border-radius:16px;direction:ltr;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;direction:ltr;justify-content:center}
.tok{padding:8px 14px;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--surface);font-size:1.1rem;font-weight:600;cursor:pointer}
.tok.used{opacity:.25;pointer-events:none}
.reveal{align-self:center}
.fbbar{position:sticky;bottom:0;margin-inline:-16px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--line)}
.fbbar.ok{background:var(--good-soft);border-top-color:var(--good)}
.fbbar.no{background:var(--bad-soft);border-top-color:var(--bad)}
.fbbar h3{margin:0 0 2px;font:800 1.2rem var(--font-display)}
.fbbar.ok h3{color:var(--good)} .fbbar.no h3{color:var(--bad)}
.fbbar p{margin:0 0 10px;font-size:.95rem}

/* race + match */
.rtime{font:800 1.4rem var(--font-display);font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
.score{background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:2px 14px;font:800 1.1rem var(--font-display);font-variant-numeric:tabular-nums}
.hint{margin:0;text-align:center;color:var(--muted);font-size:.9rem}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;direction:ltr}
.mcol{display:grid;gap:10px;align-content:start}
.mcard{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:14px 8px;font-size:1.05rem;font-weight:700;cursor:pointer;text-align:center;overflow-wrap:anywhere;min-height:60px}
.mcard.ar{direction:rtl}
.mcard.sel{border-color:var(--accent);background:var(--accent-soft)}
.mcard.ok{border-color:var(--good);background:var(--good-soft);opacity:.55;pointer-events:none}
.mcard.bad{border-color:var(--bad);background:var(--bad-soft)}

/* words */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 14px;font-weight:600;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wl{display:grid;gap:8px;margin-top:4px}
.wrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.wrow .txt{flex:1;min-width:0}
.wrow .t{font-weight:700;direction:ltr;text-align:start;overflow-wrap:anywhere}
.wrow .a{color:var(--muted);font-size:.9rem}
.wrow .lvb{font:700 .75rem var(--font-display);color:var(--muted);direction:ltr}
.dots{display:flex;gap:3px;direction:ltr}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--good)}
.wrow .spk{width:36px;height:36px}
.wrow .spk .i{width:1.1em;height:1.1em}
.empty{text-align:center;color:var(--muted);padding:24px 0}

/* backup */
.bk h3{margin:22px 0 6px;font:800 1.1rem var(--font-display)}
.bk p{margin:0 0 10px;color:var(--muted);font-size:.92rem}
.msg{min-height:1.6em;margin:10px 0 0;font-weight:600}

/* result */
.result{text-align:center;display:flex;flex-direction:column;gap:16px;padding-block:40px 10px}
.result h2{margin:0;font:800 2rem/1.2 var(--font-display)}
.result .big-n{font:800 4.5rem/1 var(--font-display);color:var(--accent);font-variant-numeric:tabular-nums}
.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rgrid div{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px}
.rgrid b{display:block;font:800 1.4rem var(--font-display);font-variant-numeric:tabular-nums}
.rgrid small{color:var(--muted)}
.acts{display:grid;gap:10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* added: goal, tiles, conjugation, reading, grammar, stats */
.goal{margin-top:14px;display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.goal>.i{width:1.8em;height:1.8em;color:var(--warm)}
.goal.hit{border-color:var(--good);background:var(--good-soft)}
.goal.hit>.i{color:var(--good)}
.gtxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;text-align:start}
.gtxt b{font:700 1rem/1.2 var(--font-display)}
.gbar{display:block;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--warm);border-radius:99px;transition:width .4s}
.goal.hit .gbar i{background:var(--good)}
.gnum{font:800 1.05rem var(--font-display);font-variant-numeric:tabular-nums;direction:ltr;color:var(--muted)}
.lead{color:var(--muted);margin:12px 0 0;font-size:.95rem}
.sub{margin:22px 0 10px;font:800 1.1rem var(--font-display)}
.lvtag{display:inline-block;font:700 .72rem/1.5 var(--font-display);background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:0 6px;direction:ltr;vertical-align:middle}
.chip[aria-pressed="true"] .lvtag{background:var(--accent-ink);color:var(--accent)}
.dim{color:var(--muted);font-size:.85em}
.chip[aria-pressed="true"] .dim{color:inherit;opacity:.8}
.chips.tenses .chip{padding:5px 12px}
.verbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px}
.vb{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:9px 12px;cursor:pointer;text-align:start;min-width:0}
.vb b{font:700 1.1rem/1.3 var(--font-body)}
.vb span{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.vbar{display:block;width:100%;height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:4px}
.vbar i{display:block;height:100%;background:var(--good)}
.tip{margin-top:14px;background:var(--accent-soft);border-radius:16px;padding:12px 16px}
.tip b{font:700 1.05rem var(--font-display)}
.tip p{margin:4px 0 0;font-size:.95rem;line-height:1.75}
.ctab{display:grid;gap:8px;margin-top:14px}
.crow{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 12px;direction:ltr}
.crow .cp{min-width:7.5em;color:var(--muted);font-weight:600;font-size:.95rem}
.crow .cf{flex:1;font:700 1.3rem var(--font-body);min-width:0;overflow-wrap:anywhere}
.crow .spk{width:38px;height:38px}
.crow .spk .i{width:1.1em;height:1.1em}
.crow.ok{border-color:var(--good);background:var(--good-soft)}
.crow.near{border-color:var(--warm)}
.crow.no{border-color:var(--bad);background:var(--bad-soft)}
.cin{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.field.sm{font-size:1.1rem;padding:8px 12px;border-radius:12px}
.corr{font-weight:700;color:var(--good);font-size:.95rem}
.acts.two{grid-template-columns:1fr 1fr}
.cjq{flex-direction:column;gap:10px}
.cjmeta{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:6px 12px}
.cjmeta .tense{background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:1px 12px;font-weight:700;font-size:.85rem}
.cjmeta .inf{font:800 1.25rem var(--font-body)}
.cjmeta .mean{color:var(--muted);font-size:.9rem}
.cjq .pr{color:var(--muted)}
.spk.slow{font:800 .85rem var(--font-display);width:48px;height:48px}
.ractions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn.sm{width:auto;font-size:.95rem;padding:8px 14px;border-radius:12px;display:inline-flex;align-items:center;gap:6px;border-bottom-width:4px}
.rtext{margin-top:14px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px;font:500 1.15rem/1.9 var(--font-body);text-align:left;max-width:65ch}
.rtext.hidden{color:var(--muted);text-align:center;font-size:1rem;direction:rtl}
.gloss{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.gloss span{background:var(--accent-soft);border-radius:10px;padding:3px 10px;font-size:.88rem}
.rq{margin-top:18px}
.rq p{margin:0 0 8px;font-weight:700}
.glist{display:grid;gap:10px;margin-top:10px}
.gitem{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 16px}
.gitem b{font:700 1.05rem var(--font-display)}
.gitem p{margin:4px 0 0;line-height:1.8}
.gitem.tense{border-color:var(--accent);border-style:dashed}
.panel{margin-top:16px;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ph h3{margin:0;font:800 1.1rem var(--font-display)}
.chart{width:100%;height:auto;display:block;direction:ltr}
.chart .axis{stroke:var(--line);stroke-width:2}
.chart .goalline{stroke:var(--warm);stroke-width:1.5;stroke-dasharray:5 4}
.chart .glab{fill:var(--warm);font:700 11px var(--font-body)}
.chart .bar{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.chart .bar.hit{fill:var(--good);stroke:var(--good)}
.chart .bar.today{fill:var(--accent);stroke:var(--accent)}
.chart .bar.today.hit{fill:var(--good);stroke:var(--good-deep)}
.chart .val{fill:var(--ink);font:700 12px var(--font-body)}
.chart .day{fill:var(--muted);font:600 11px var(--font-body)}
.chart .day.t{fill:var(--ink);font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.kpis div{display:flex;flex-direction:column;gap:1px;background:var(--bg);border-radius:12px;padding:8px 10px;min-width:0}
.kpis small{color:var(--muted);font-size:.78rem}
.kpis b{font:800 1.3rem/1.2 var(--font-display);font-variant-numeric:tabular-nums}
.kpis span{font-size:.75rem;font-weight:700}
.up{color:var(--good)} .down{color:var(--bad)}
@media (max-width:480px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lvbars{display:grid;gap:10px}
.lvb2{display:grid;grid-template-columns:2.6em 1fr 4.5em;align-items:center;gap:10px}
.lvb2.wide{grid-template-columns:minmax(6em,9em) 1fr 3em}
.lvb2>span:first-child{font:800 1rem var(--font-display);overflow-wrap:anywhere}
.lvb2 .track{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.lvb2 .track i{display:block;height:100%;background:var(--good);border-radius:99px}
.lvb2 .track.warn i{background:var(--warm)}
.lvb2 .num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;direction:ltr;text-align:end}
.miss{display:grid;gap:8px}
.mrow{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.mrow:last-child{border-bottom:0}
.mrow .txt{flex:1;min-width:0}
.mrow .t{font-weight:700;text-align:start;overflow-wrap:anywhere}
.mrow .a{color:var(--muted);font-size:.88rem}
.mbar{width:70px;height:8px;border-radius:9px;background:var(--line);overflow:hidden;flex:none}
.mbar i{display:block;height:100%;background:var(--bad)}
.mn{font:800 1rem var(--font-display);color:var(--bad);min-width:2.2em;text-align:center;font-variant-numeric:tabular-nums}
.mrow .spk{width:36px;height:36px}
.mrow .spk .i{width:1.1em;height:1.1em}

["A1","الساعة",["Son las ocho|الساعة تمانية","y media|ونص","y cuarto|وربع","menos cuarto|إلا ربع","mediodía|الضهر","medianoche|نص الليل","temprano|بدري","tarde|متأخر"],"للساعة واحدة بنقول es la una، وللباقي son las: son las tres y media. وللميعاد: a las ocho (الساعة تمانية)."],
["A1","المواصلات",["el autobús|الأتوبيس","el metro|المترو","el tren|القطر","el coche|العربية","la bicicleta|العجلة","el avión|الطيارة","el taxi|التاكسي","a pie|ماشي على رجلي"],"مع المواصلات بنقول en: en autobús، en tren، en coche. والمشي: a pie أو andando. وفي أمريكا اللاتينية العربية el carro أو el auto."],
["A1","تعبيرات tener",["tengo sed|أنا عطشان","tengo frío|أنا بردان","tengo calor|أنا حران","tengo sueño|أنا نعسان","tengo miedo|أنا خايف","tengo razón|معايا حق","tengo prisa|أنا مستعجل","tengo veinte años|عندي عشرين سنة"],"الإسباني بيستخدم tener مع الإحساس والسن: tengo frío مش estoy frío. وtengo que + فعل معناها «لازم»: tengo que trabajar."],
["A1","صفات الشخصية",["amable|طيب / ذوق","gracioso|دمه خفيف","inteligente|ذكي","tímido|خجول","serio|جد","perezoso|كسلان","trabajador|شغّيل","simpático|لطيف"],"الصفات اللي بتنتهي بـ e مبتتغيرش: amable، inteligente. واللي بتنتهي بـ or بتزيد a: trabajador ← trabajadora. وللشخصية بنستخدم ser."],
["A1","الفصل والمدرسة",["el libro|الكتاب","el bolígrafo|القلم","el cuaderno|الكشكول","la pregunta|السؤال","la respuesta|الإجابة","escuchar|يسمع","repetir|يعيد","los deberes|الواجب"],"في الفصل هتسمع: escuchad (اسمعوا)، repetid (عيدوا)، abrid el libro. دي صيغة الأمر مع vosotros في إسبانيا."],
["A2","في الفندق",["Tengo una reserva a nombre de Salah|عندي حجز باسم صلاح","Una habitación para dos noches|أوضة لليلتين","¿El desayuno está incluido?|الفطار داخل في السعر؟","¿A qué hora hay que dejar la habitación?|لازم أسيب الأوضة الساعة كام؟","El aire acondicionado no funciona|التكييف مش شغال","¿Hay wifi?|فيه واي فاي؟","Quisiera una habitación tranquila|عايز أوضة هادية","¿Puede llamar a un taxi?|ممكن تطلب تاكسي؟"],"no funciona معناها «مش شغال» لأي جهاز. وhay معناها «فيه» وثابتة للمفرد والجمع: hay wifi، hay dos camas."],
["A2","التليفون والمواعيد",["¿Diga? Soy Ahmed|ألو، أنا أحمد","Quisiera hablar con la señora Martín|عايز أكلم مدام مارتين","No cuelgue, por favor|خليك معايا على الخط","Te llamo más tarde|هكلمك بعدين","¿Quedamos el sábado?|نتقابل السبت؟","Estoy libre mañana por la noche|أنا فاضي بكرة بالليل","Lo siento, no puedo|آسف، مش هقدر","Nos vemos delante del café|نتقابل قدام الكافيه"],"quedar معناها «يتفق على ميعاد»: ¿quedamos? (نتقابل؟)، he quedado con Ana (عندي ميعاد مع آنا). كلمة أساسية في إسبانيا."],
["A2","المطبخ والطبخ",["cortar|يقطّع","añadir|يضيف","mezclar|يخلط","cocinar|يطبخ","la sal|الملح","el azúcar|السكر","el aceite|الزيت","la sartén|الطاسة"],"في الوصفات بيستخدموا se: se corta la cebolla (البصل بيتقطع). أو الأمر مع usted: corte la cebolla."],
["A2","زمان (imperfecto)",["Cuando era pequeño|لما كنت صغير","Hacía buen tiempo|الجو كان حلو","Tenía un perro|كان عندي كلب","Vivíamos en Alejandría|كنا ساكنين في إسكندرية","Jugaba al fútbol todos los días|كنت بلعب كورة كل يوم","Era genial|كان تحفة","Había mucha gente|كان فيه زحمة","Quería ser piloto|كنت عايز أبقى طيار"],"الـ imperfecto للوصف والعادة في الماضي: jugaba (كنت بلعب). -ar بتاخد -aba، و-er/-ir بتاخد -ía. والشواذ تلاتة بس: ser (era)، ir (iba)، ver (veía)."],
["A2","المقارنة",["Es más alto que yo|هو أطول مني","Ella es menor que su hermano|هي أصغر من أخوها","Es tan caro como antes|غالي زي الأول","Este restaurante es mejor|المطعم ده أحسن","Habla mejor que yo|بيتكلم أحسن مني","Es el día más bonito de mi vida|ده أحلى يوم في حياتي","Tengo tanto trabajo como tú|عندي شغل قدك","Es peor que ayer|ده أوحش من إمبارح"],"más/menos + صفة + que، والمساواة tan + صفة + como. والشواذ: bueno ← mejor، malo ← peor، joven ← menor، viejo ← mayor."],
["A2","الطبيعة",["el mar|البحر","la montaña|الجبل","la playa|البلاج","el río|النهر","el bosque|الغابة","el desierto|الصحرا","la isla|الجزيرة","el cielo|السما"],"نقول ir a la playa، ir a la montaña. وel cielo معناها السما والجنة كمان، ومنها ¡cielo! كلمة دلع."],
["A2","شغل البيت",["limpiar la casa|ينضف البيت","fregar los platos|يغسل المواعين","hacer la compra|يشتري طلبات البيت","ordenar|يرتّب","lavar la ropa|يغسل الهدوم","barrer|يكنس","sacar la basura|يطلّع الزبالة","planchar|يكوي"],"hacer la compra في إسبانيا = يشتري طلبات البيت. وfregar فعل بيتغير جذره: yo friego، tú friegas."],
["A2","ضمائر المفعول",["Lo veo|بشوفه","La conozco|أعرفها","Le hablo|بكلمه / بكلمها","Les escribo|بكتب لهم","Me mira|بيبص لي","Te quiero|بحبك","¿Puedes ayudarme?|ممكن تساعدني؟","Los compré ayer|اشتريتهم إمبارح"],"الضمير قبل الفعل المصرّف: lo veo. ومع المصدر بيلزق في آخره: ayudarme، verlo. lo/la/los/las للمفعول المباشر وle/les للغير مباشر."],
["B1","مقابلة شغل",["Hábleme de usted|كلمني عن نفسك","Tengo cinco años de experiencia|عندي خبرة خمس سنين","Soy motivado y organizado|أنا متحمس ومنظم","¿Por qué quiere este puesto?|ليه عايز الوظيفة دي؟","Mi punto fuerte es la comunicación|نقطة قوتي التواصل","Trabajo bien en equipo|بشتغل كويس في فريق","¿Cuál es el sueldo?|المرتب كام؟","¿Cuándo podría empezar?|تقدر تبدأ إمتى؟"],"في المقابلات استخدم usted والـ condicional للأدب: podría، me gustaría، quisiera."],
["B1","الصحة ونمط الحياة",["la salud|الصحة","la dieta|الرجيم","hacer deporte|يلعب رياضة","el estrés|التوتر","el sueño|النوم / الحلم","adelgazar|يخس","engordar|يتخن","equilibrado|متوازن"],"el sueño ليها معنيين: النوم والحلم. وestar a dieta = عامل رجيم. وhacer ejercicio = يتمرّن."],
["B1","الإعلام",["el periódico|الجورنال","el artículo|المقالة","las noticias|الأخبار","el canal|القناة","el programa|البرنامج","el periodista|الصحفي","la publicidad|الإعلانات","las redes sociales|السوشيال ميديا"],"el programa مذكر رغم إنه بينتهي بـ a، زي el problema وel tema وel sistema (كلمات أصلها يوناني)."],
["B1","العلاقات",["la pareja|الشريك / الكابل","casarse con|يتجوز","divorciarse|يطلّق","la confianza|الثقة","discutir|يتخانق / يتناقش","reconciliarse|يتصالح","llevarse bien con|يتفاهم كويس مع","enamorarse de|يقع في حب"],"نقول casarse con مش casarse a، وenamorarse de. وme llevo bien con mi jefe = بتفاهم كويس مع مديري."],
["B1","حكاية في الماضي",["Dormía cuando sonó el teléfono|كنت نايم لما التليفون رن","Llovía, así que me quedé en casa|كانت بتمطر فقعدت في البيت","Mientras cocinaba, llegó él|وأنا بطبخ وصل","De repente, oí un ruido|فجأة سمعت صوت","Primero visitamos el museo|الأول زرنا المتحف","Luego fuimos al restaurante|بعد كده رحنا المطعم","Al final, todo salió bien|في الآخر كل حاجة عدّت على خير","Hace dos años me mudé|من سنتين نقلت"],"الـ imperfecto للخلفية والـ indefinido للحدث: dormía (خلفية) cuando sonó (حدث). وhace + مدة = من قد إيه: hace dos años."],
["B1","الشكوى وحل المشاكل",["Hay un problema con mi pedido|فيه مشكلة في الأوردر بتاعي","No funciona|مش شغال","Quisiera un reembolso|عايز فلوسي ترجع","Quisiera hablar con el encargado|عايز أكلم المسؤول","No es lo que pedí|ده مش اللي طلبته","¿Puede cambiarlo?|ممكن تبدّله؟","Llevo una hora esperando|بقالي ساعة مستني","¿Qué me propone?|إيه الحل اللي تقترحه؟"],"llevar + مدة + gerundio = بقالي... بعمل: llevo una hora esperando. وlo que معناها «اللي»: lo que pedí."],
["B1","الفلوس والبنك",["el dinero|الفلوس","el banco|البنك","la cuenta|الحساب / الفاتورة","pagar|يدفع","ahorrar|يحوّش","pedir prestado|يستلف","la tarjeta|الكارت","prestar|يسلّف"],"pedir prestado = ياخد سلفة، prestar = يدّي سلفة. وla cuenta ليها معنيين: حساب البنك والحساب في المطعم."],
["B1","que وquien وdonde",["La mujer que habla es mi profesora|الست اللي بتتكلم دي مدرّستي","El libro que leo es apasionante|الكتاب اللي بقراه ممتع","La ciudad donde vivo es tranquila|المدينة اللي ساكن فيها هادية","El chico con quien hablé es mi primo|الولد اللي كلمته ده ابن عمي","Es el día en que la conocí|ده اليوم اللي قابلتها فيه","Lo que más me gusta es viajar|أكتر حاجة بحبها السفر","El hombre que viste es mi vecino|الراجل اللي شفته ده جاري","Es una autora cuyos libros me encantan|دي كاتبة بحب كتبها جداً"],"que هو الأشهر للأشخاص والحاجات، quien بعد حرف جر للأشخاص (con quien)، donde للمكان، وcuyo (اللي... بتاعه) بيتفق مع اللي بعده: cuyos libros."],
["B2","الاقتصاد والأعمال",["la bolsa|البورصة","la inversión|الاستثمار","la competencia|المنافسة","el beneficio|المكسب","la deuda|الدين","la inflación|التضخم","el sueldo|المرتب","la crisis|الأزمة"],"في الأخبار هتسمع: la tasa de desempleo (نسبة البطالة)، el poder adquisitivo (القوة الشرائية)، la subida de precios (ارتفاع الأسعار)."],
["B2","العلوم والبحث",["la investigación|البحث العلمي","el experimento|التجربة","el descubrimiento|الاكتشاف","el investigador|الباحث","la hipótesis|الفرضية","demostrar|يثبت","la inteligencia artificial|الذكاء الاصطناعي","el estudio|الدراسة"],"la experiencia = خبرة، وel experimento = تجربة علمية. وun estudio demuestra que... تعبير ثابت في المقالات."],
["B2","الثقافة والفن",["la obra|العمل الفني","la novela|الرواية","la exposición|المعرض","el espectáculo|العرض","el patrimonio|التراث","el director|المخرج","la crítica|النقد","la obra maestra|التحفة الفنية"],"la novela رواية، والمسلسل la telenovela. ونقول una película dirigida por... (فيلم من إخراج...)."],
["B2","المبني للمجهول",["El puente fue construido en 1990|الكوبري اتبنى سنة ١٩٩٠","Es considerado un experto|بيعتبروه خبير","La ley será votada la próxima semana|القانون هيتصوّت عليه الأسبوع الجاي","Este libro se lee en todo el mundo|الكتاب ده بيتقري في العالم كله","Se dice que la situación va a cambiar|بيقولوا إن الوضع هيتغير","Se habla español en 21 países|الإسباني بيتكلموه في ٢١ دولة","La decisión fue tomada ayer|القرار اتاخد إمبارح","Los resultados se publicarán mañana|النتايج هتتنشر بكرة"],"المبني للمجهول = ser + اسم المفعول متفق (fue construido). بس الأشهر في الكلام هو se: se dice، se habla، se venden pisos."],
["B2","الكلام المنقول",["Me dijo que vendría|قال لي إنه هييجي","Me preguntó si estaba libre|سألني إذا كنت فاضي","Explicó que había perdido el tren|شرح إنه فاته القطر","Afirmó que todo iba bien|أكّد إن كل حاجة تمام","Me preguntó qué hacía|سألني بعمل إيه","Anunciaron que se casaban|أعلنوا إنهم هيتجوزوا","Le aconsejé que se fuera|نصحته يمشي","Prometió que me llamaría|وعد إنه هيكلمني"],"الأزمنة بترجع خطوة: presente ← imperfecto، futuro ← condicional. ومع الأوامر والنصايح في الماضي بييجي subjuntivo imperfecto: le aconsejé que se fuera."],
["B2","الفرضيات والندم",["Si lo hubiera sabido, habría venido|لو كنت أعرف كنت جيت","Debería haberte escuchado|كان المفروض أسمع كلامك","Podría haber aprobado|كان ممكن ينجح","Yo que tú, no aceptaría|لو مكانك مكنتش وافقت","Si hubieras venido, te habría encantado|لو كنت جيت كنت هتحبها جداً","Me habría gustado viajar más|كان نفسي أسافر أكتر","Por si llueve, lleva un paraguas|لو مطرت خد شمسية","Sin tu ayuda, no lo habría conseguido|من غير مساعدتك مكنتش هنجح"],"الندم: si + pluscuamperfecto de subjuntivo ← condicional perfecto: si lo hubiera sabido, habría venido. وyo que tú = لو مكانك."],
["B2","الكتابة الرسمية",["Le escribo en relación con mi solicitud|بكتب لحضرتك بخصوص طلبي","Le adjunto mi currículum|مرفق السيرة الذاتية","Tras nuestra conversación telefónica|بعد مكالمتنا التليفونية","Me pongo en contacto con usted|بتواصل مع حضرتك","Quedo a su disposición|أنا تحت أمرك لأي استفسار","A la espera de su respuesta|في انتظار ردك","Reciba un cordial saludo|تقبّل تحياتي","Atentamente|مع خالص التحية"],"الإيميل الرسمي بيبدأ بـ Estimado señor / Estimada señora: (بنقطتين مش فاصلة) ويخلص بـ Atentamente أو Un saludo."],
["B2","الشغل والمسيرة",["la formación|التدريب / التعليم","el título|الشهادة","la contratación|التعيين","el despido|الرفد","la carrera|المسيرة / الدراسة الجامعية","la habilidad|المهارة","las prácticas|التدريب العملي","el ascenso|الترقية"],"hacer prácticas = يعمل تدريب عملي. وla carrera ليها معنيين: الدراسة الجامعية (estudio la carrera de Derecho) والمسيرة المهنية."]

{lv:"A0",title:"أنا وبيتي",text:"Bonjour ! Je m'appelle Karim. J'habite au Caire. Ma maison est petite mais belle. Il y a une cuisine, deux chambres et un salon. Dans ma chambre, il y a un lit, une table et une chaise. J'ai un chat. Il est noir et blanc. Il dort sur mon lit.",gl:["habite|ساكن","mais|لكن","le salon|الصالة","il y a|فيه"],qs:[["كريم ساكن فين؟",["القاهرة","إسكندرية","باريس"],0],["فيه كام أوضة نوم؟",["واحدة","اتنين","تلاتة"],1],["القطة لونها إيه؟",["أسود وأبيض","أحمر","أصفر"],0]]},
{lv:"A0",title:"في السوق",text:"C'est samedi. Sophie va au marché avec sa mère. Elle achète des tomates, des oranges et du pain. Les fraises sont très bonnes mais un peu chères. Sa mère achète du fromage et un poulet. Elles rentrent à la maison à midi.",gl:["achète|بتشتري","chères|غالية","rentrent|بيرجعوا"],qs:[["صوفي راحت السوق مع مين؟",["أبوها","أمها","صاحبتها"],1],["الفراولة كانت عاملة إزاي؟",["رخيصة","حلوة بس غالية شوية","وحشة"],1],["رجعوا البيت إمتى؟",["الصبح بدري","الضهر","بالليل"],1]]},
{lv:"A1",title:"يوم في حياة ليلى",text:"Leïla est infirmière. Elle se lève à six heures et prend le petit-déjeuner avec son mari. Elle va à l'hôpital en métro. Elle travaille de sept heures à quinze heures. Le soir, elle fait du sport ou elle lit un livre. Le week-end, elle aime sortir avec ses amies au cinéma.",gl:["infirmière|ممرضة","son mari|جوزها","le soir|بالليل","sortir|تخرج"],qs:[["ليلى شغلتها إيه؟",["دكتورة","ممرضة","مدرّسة"],1],["بتروح الشغل إزاي؟",["بالمترو","بالعربية","مشي"],0],["بتعمل إيه في الويك إند؟",["بتنام","بتخرج مع صحباتها للسينما","بتشتغل"],1]]},
{lv:"A1",title:"رسالة لصاحب",text:"Salut Paul, je suis à Marseille avec ma famille. Il fait très chaud et le ciel est bleu. Le matin, nous allons à la plage. À midi, nous mangeons du poisson dans un petit restaurant. Le soir, nous nous promenons dans le vieux port. Je rentre dimanche. À bientôt ! Yasmine",gl:["nous nous promenons|بنتمشى","le vieux port|الميناء القديم","à bientôt|أشوفك قريب"],qs:[["ياسمين فين؟",["في مرسيليا","في باريس","في القاهرة"],0],["الجو عامل إزاي؟",["بارد","حر جداً","بيمطر"],1],["هترجع إمتى؟",["السبت","الحد","الاتنين"],1]]},
{lv:"A2",title:"لما كنت صغير",text:"Quand j'étais petit, j'habitais dans un village près d'Assouan. Notre maison avait un grand jardin avec des palmiers. Tous les matins, je marchais vingt minutes pour aller à l'école. Après l'école, je jouais au football avec mes cousins. Le vendredi, toute la famille mangeait chez ma grand-mère. C'était une vie simple, mais j'étais heureux. Il y a dix ans, nous avons déménagé au Caire.",gl:["près de|قريب من","les palmiers|النخل","déménagé|نقلنا","heureux|مبسوط"],qs:[["الكاتب كان ساكن فين وهو صغير؟",["في قرية قريبة من أسوان","في القاهرة","في إسكندرية"],0],["يوم الجمعة كانوا بيعملوا إيه؟",["بيروحوا البحر","بياكلوا عند الجدة","بيلعبوا كورة"],1],["نقلوا القاهرة إمتى؟",["من عشر سنين","من سنتين","السنة اللي فاتت"],0]]},
{lv:"A2",title:"عند الدكتور",text:"Hier, Marc ne se sentait pas bien. Il avait mal à la tête et un peu de fièvre. Il a appelé le médecin et il a pris un rendez-vous pour l'après-midi. Le médecin l'a examiné et a dit : « Ce n'est pas grave, c'est un petit rhume. Reposez-vous, buvez beaucoup d'eau et prenez ce médicament trois fois par jour. » Marc est passé à la pharmacie, puis il est rentré se coucher.",gl:["rendez-vous|ميعاد","grave|خطير","un rhume|برد","reposez-vous|ارتاح"],qs:[["مارك كان عنده إيه؟",["وجع في ضهره","صداع وسخونية خفيفة","وجع في سنانه"],1],["الدكتور قال إيه؟",["لازم يدخل المستشفى","مش خطير، دور برد بسيط","محتاج عملية"],1],["ياخد الدوا كام مرة؟",["مرة في اليوم","مرتين","تلات مرات في اليوم"],2]]},
{lv:"B1",title:"الشغل من البيت",text:"Depuis la pandémie, de plus en plus d'entreprises permettent à leurs employés de travailler à distance. Pour beaucoup, c'est un vrai avantage : on ne perd plus de temps dans les transports et on peut mieux organiser sa journée. Cependant, le télétravail a aussi des inconvénients. Certains se sentent isolés et ont du mal à séparer vie professionnelle et vie privée. C'est pourquoi beaucoup d'entreprises choisissent aujourd'hui une formule mixte : deux ou trois jours au bureau, le reste à la maison.",gl:["à distance|عن بعد","un avantage|ميزة","les inconvénients|العيوب","isolés|معزولين","une formule mixte|نظام مختلط"],qs:[["إيه ميزة الشغل من البيت حسب النص؟",["المرتب أعلى","مفيش وقت ضايع في المواصلات","الشغل أقل"],1],["إيه من عيوبه؟",["الإحساس بالعزلة","الإنترنت غالي","المدير بيزعل"],0],["شركات كتير بتختار إيه دلوقتي؟",["الشغل من المكتب بس","البيت بس","نظام مختلط بين المكتب والبيت"],2]]},
{lv:"B1",title:"رحلة مش متوقعة",text:"L'été dernier, nous avions prévu de passer une semaine à Lyon. Mais le jour du départ, notre train a été annulé à cause d'une grève. Nous étions très déçus. Au lieu de rentrer à la maison, nous avons loué une voiture et nous sommes partis vers les Alpes. Nous ne connaissions pas la région, mais les paysages étaient magnifiques. Finalement, ce voyage improvisé est devenu l'un de nos meilleurs souvenirs.",gl:["prévu|كنا مخططين","annulé|اتلغى","une grève|إضراب","déçus|زعلانين / محبطين","au lieu de|بدل ما"],qs:[["ليه القطر اتلغى؟",["بسبب الجو","بسبب إضراب","بسبب عطل"],1],["عملوا إيه بدل ما يرجعوا؟",["أجّروا عربية وراحوا الألب","ركبوا طيارة","استنوا لليوم اللي بعده"],0],["الرحلة بقت إيه في الآخر؟",["تجربة وحشة","من أحلى ذكرياتهم","رحلة مملة"],1]]},
{lv:"B2",title:"السوشيال ميديا والشباب",text:"Selon une étude récente, les adolescents français passent en moyenne plus de trois heures par jour sur les réseaux sociaux. Si ces plateformes leur permettent de rester en contact avec leurs amis et d'accéder à une quantité impressionnante d'informations, elles ne sont pas sans risques. Les chercheurs soulignent notamment l'impact sur le sommeil et sur l'estime de soi, les jeunes ayant tendance à se comparer constamment aux autres. Faut-il pour autant interdire les écrans ? La plupart des spécialistes estiment qu'il vaut mieux éduquer les jeunes à un usage raisonné plutôt que de tout interdire.",gl:["en moyenne|في المتوسط","soulignent|بيأكدوا","l'estime de soi|الثقة بالنفس","pour autant|مع ذلك / بناءً على كده","un usage raisonné|استخدام واعي"],qs:[["المراهقين بيقضوا قد إيه على السوشيال ميديا؟",["أقل من ساعة","أكتر من تلات ساعات في اليوم","عشر ساعات"],1],["الباحثين قلقانين من تأثيرها على إيه؟",["النوم والثقة بالنفس","الدراسة بس","الأكل"],0],["رأي أغلب المتخصصين إيه؟",["نمنع الموبايلات خالص","نعلّم الشباب استخدام واعي","مفيش مشكلة"],1]]},
{lv:"B2",title:"المدن والعربيات",text:"De nombreuses villes européennes cherchent à réduire la place de la voiture dans leur centre. Paris, par exemple, a multiplié les pistes cyclables et transformé certaines voies rapides en promenades piétonnes. Les partisans de ces mesures affirment qu'elles améliorent la qualité de l'air et la qualité de vie. Leurs opposants, en revanche, dénoncent des embouteillages accrus et des mesures qui, selon eux, pénalisent ceux qui habitent en banlieue et n'ont pas d'alternative. Le débat reste vif, mais une chose est sûre : la ville de demain ne ressemblera pas à celle d'hier.",gl:["les pistes cyclables|حارات العجل","les partisans|المؤيدين","en revanche|في المقابل","les embouteillages|الزحمة المرورية","la banlieue|الضواحي"],qs:[["باريس عملت إيه؟",["زودت حارات العجل وحولت طرق لممشى","بنت كباري جديدة","منعت الأتوبيسات"],0],["المعارضين بيقولوا إيه؟",["الهوا بقى أنضف","الزحمة زادت وسكان الضواحي اتضرروا","مفيش أي تغيير"],1],["إيه الحاجة الأكيدة حسب الكاتب؟",["العربيات هتختفي","مدينة المستقبل مش هتبقى زي زمان","النقاش خلص"],1]]}
],
es:[
{lv:"A0",title:"أنا وبيتي",text:"¡Hola! Me llamo Karim. Vivo en El Cairo. Mi casa es pequeña pero bonita. Hay una cocina, dos dormitorios y un salón. En mi dormitorio hay una cama, una mesa y una silla. Tengo un gato. Es negro y blanco. Duerme en mi cama.",gl:["vivo|ساكن","pero|لكن","el salón|الصالة","hay|فيه"],qs:[["كريم ساكن فين؟",["القاهرة","إسكندرية","مدريد"],0],["فيه كام أوضة نوم؟",["واحدة","اتنين","تلاتة"],1],["القطة لونها إيه؟",["أسود وأبيض","أحمر","أصفر"],0]]},
{lv:"A0",title:"في السوق",text:"Es sábado. Lucía va al mercado con su madre. Compra tomates, naranjas y pan. Las fresas están muy buenas, pero son un poco caras. Su madre compra queso y un pollo. Vuelven a casa a mediodía.",gl:["compra|بتشتري","caras|غالية","vuelven|بيرجعوا"],qs:[["لوسيا راحت السوق مع مين؟",["أبوها","أمها","صاحبتها"],1],["الفراولة كانت عاملة إزاي؟",["رخيصة","حلوة بس غالية شوية","وحشة"],1],["رجعوا البيت إمتى؟",["الصبح بدري","الضهر","بالليل"],1]]},
{lv:"A1",title:"يوم في حياة ليلى",text:"Leila es enfermera. Se levanta a las seis y desayuna con su marido. Va al hospital en metro. Trabaja de siete a tres. Por la tarde hace deporte o lee un libro. Los fines de semana le gusta salir con sus amigas al cine.",gl:["enfermera|ممرضة","su marido|جوزها","por la tarde|بعد الضهر","salir|تخرج"],qs:[["ليلى شغلتها إيه؟",["دكتورة","ممرضة","مدرّسة"],1],["بتروح الشغل إزاي؟",["بالمترو","بالعربية","مشي"],0],["بتعمل إيه في الويك إند؟",["بتنام","بتخرج مع صحباتها للسينما","بتشتغل"],1]]},
{lv:"A1",title:"رسالة لصاحب",text:"Hola, Pablo: estoy en Valencia con mi familia. Hace mucho calor y el cielo está azul. Por la mañana vamos a la playa. A mediodía comemos paella en un restaurante pequeño. Por la noche paseamos por el centro. Vuelvo el domingo. ¡Hasta pronto! Yasmín",gl:["paseamos|بنتمشى","el centro|وسط البلد","hasta pronto|أشوفك قريب"],qs:[["ياسمين فين؟",["في فالنسيا","في مدريد","في القاهرة"],0],["الجو عامل إزاي؟",["بارد","حر جداً","بيمطر"],1],["هترجع إمتى؟",["السبت","الحد","الاتنين"],1]]},
{lv:"A2",title:"لما كنت صغير",text:"Cuando era pequeño, vivía en un pueblo cerca de Asuán. Nuestra casa tenía un jardín grande con palmeras. Todas las mañanas caminaba veinte minutos para ir al colegio. Después de clase, jugaba al fútbol con mis primos. Los viernes, toda la familia comía en casa de mi abuela. Era una vida sencilla, pero yo era feliz. Hace diez años nos mudamos a El Cairo.",gl:["cerca de|قريب من","las palmeras|النخل","nos mudamos|نقلنا","sencilla|بسيطة"],qs:[["الكاتب كان ساكن فين وهو صغير؟",["في قرية قريبة من أسوان","في القاهرة","في إسكندرية"],0],["يوم الجمعة كانوا بيعملوا إيه؟",["بيروحوا البحر","بياكلوا عند الجدة","بيلعبوا كورة"],1],["نقلوا القاهرة إمتى؟",["من عشر سنين","من سنتين","السنة اللي فاتت"],0]]},
{lv:"A2",title:"عند الدكتور",text:"Ayer Marcos no se sentía bien. Le dolía la cabeza y tenía un poco de fiebre. Llamó al médico y pidió una cita para la tarde. El médico lo examinó y dijo: «No es grave, es un resfriado. Descanse, beba mucha agua y tome este medicamento tres veces al día». Marcos pasó por la farmacia y luego se fue a la cama.",gl:["una cita|ميعاد","grave|خطير","un resfriado|برد","descanse|ارتاح"],qs:[["ماركوس كان عنده إيه؟",["وجع في ضهره","صداع وسخونية خفيفة","وجع في سنانه"],1],["الدكتور قال إيه؟",["لازم يدخل المستشفى","مش خطير، دور برد","محتاج عملية"],1],["ياخد الدوا كام مرة؟",["مرة في اليوم","مرتين","تلات مرات في اليوم"],2]]},
{lv:"B1",title:"الشغل من البيت",text:"Desde la pandemia, cada vez más empresas permiten a sus empleados trabajar a distancia. Para muchos es una gran ventaja: ya no pierden tiempo en el transporte y pueden organizar mejor su día. Sin embargo, el teletrabajo también tiene inconvenientes. Algunas personas se sienten aisladas y les cuesta separar la vida profesional de la vida privada. Por eso, muchas empresas eligen hoy un modelo mixto: dos o tres días en la oficina y el resto en casa.",gl:["a distancia|عن بعد","una ventaja|ميزة","inconvenientes|عيوب","aisladas|معزولين","les cuesta|بيصعب عليهم"],qs:[["إيه ميزة الشغل من البيت حسب النص؟",["المرتب أعلى","مفيش وقت ضايع في المواصلات","الشغل أقل"],1],["إيه من عيوبه؟",["الإحساس بالعزلة","الإنترنت غالي","المدير بيزعل"],0],["شركات كتير بتختار إيه دلوقتي؟",["المكتب بس","البيت بس","نظام مختلط بين المكتب والبيت"],2]]},
{lv:"B1",title:"رحلة مش متوقعة",text:"El verano pasado habíamos planeado pasar una semana en Sevilla. Pero el día de la salida cancelaron nuestro tren por una huelga. Estábamos muy decepcionados. En lugar de volver a casa, alquilamos un coche y nos fuimos hacia el norte. No conocíamos la región, pero los paisajes eran preciosos. Al final, aquel viaje improvisado se convirtió en uno de nuestros mejores recuerdos.",gl:["habíamos planeado|كنا مخططين","una huelga|إضراب","decepcionados|محبطين","en lugar de|بدل ما","se convirtió en|بقى"],qs:[["ليه القطر اتلغى؟",["بسبب الجو","بسبب إضراب","بسبب عطل"],1],["عملوا إيه بدل ما يرجعوا؟",["أجّروا عربية وراحوا الشمال","ركبوا طيارة","استنوا لليوم اللي بعده"],0],["الرحلة بقت إيه في الآخر؟",["تجربة وحشة","من أحلى ذكرياتهم","رحلة مملة"],1]]},
{lv:"B2",title:"السوشيال ميديا والشباب",text:"Según un estudio reciente, los adolescentes españoles pasan de media más de tres horas al día en las redes sociales. Aunque estas plataformas les permiten mantenerse en contacto con sus amigos y acceder a una cantidad enorme de información, no están exentas de riesgos. Los investigadores destacan sobre todo su impacto en el sueño y en la autoestima, ya que los jóvenes tienden a compararse constantemente con los demás. ¿Habría que prohibir las pantallas? La mayoría de los expertos considera que es preferible educar a los jóvenes en un uso responsable en lugar de prohibirlo todo.",gl:["de media|في المتوسط","exentas de|خالية من","destacan|بيأكدوا","la autoestima|الثقة بالنفس","un uso responsable|استخدام واعي"],qs:[["المراهقين بيقضوا قد إيه على السوشيال ميديا؟",["أقل من ساعة","أكتر من تلات ساعات في اليوم","عشر ساعات"],1],["الباحثين قلقانين من تأثيرها على إيه؟",["النوم والثقة بالنفس","الدراسة بس","الأكل"],0],["رأي أغلب الخبراء إيه؟",["نمنع الموبايلات خالص","نعلّم الشباب استخدام واعي","مفيش مشكلة"],1]]},
{lv:"B2",title:"المدن والعربيات",text:"Numerosas ciudades europeas intentan reducir el espacio del coche en sus centros. Madrid y Barcelona, por ejemplo, han creado zonas de bajas emisiones y han ampliado los carriles bici. Los partidarios de estas medidas sostienen que mejoran la calidad del aire y la calidad de vida. Sus detractores, en cambio, denuncian más atascos y creen que perjudican a quienes viven en las afueras y no tienen alternativa. El debate sigue abierto, pero una cosa es segura: la ciudad del futuro no se parecerá a la del pasado.",gl:["los carriles bici|حارات العجل","los partidarios|المؤيدين","en cambio|في المقابل","los atascos|الزحمة المرورية","las afueras|الضواحي"],qs:[["مدريد وبرشلونة عملوا إيه؟",["مناطق انبعاثات قليلة وحارات عجل أكتر","كباري جديدة","منعوا الأتوبيسات"],0],["المعارضين بيقولوا إيه؟",["الهوا بقى أنضف","الزحمة زادت وسكان الضواحي اتضرروا","مفيش أي تغيير"],1],["إيه الحاجة الأكيدة حسب الكاتب؟",["العربيات هتختفي","مدينة المستقبل مش هتبقى زي زمان","النقاش خلص"],1]]}
]};

var view="home",lastView="",G=null,RES=null,LAST=null,M=null,R=null,raceTimer=null,resetArm=false;

function pickType(it){
  if(it.cj)return rec(it).box===0?"cmc":"ctype";
  var b=rec(it).box;
  if(isPh(it)){if(b===0)return "mc";if(b===1)return "fill";if(b===3&&canSpeak)return "listen";if(b>=4&&canSpeak&&Math.random()<.35)return "dict";return "build";}
  if(b===0)return Math.random()<.5?"mc":"mcr";
  if(b===1)return "mcr";
  if(b===2)return canSpeak?"listen":"mcr";
  if(b>=4&&canSpeak&&Math.random()<.5)return "dict";
  return "type";
}
function pickGameType(it){
  var a;
  if(isPh(it)){a=["mc","fill","build"];}else{a=["mc","mcr"];if(canSpeak)a.push("listen");}
  return a[Math.floor(Math.random()*a.length)];
}
function distract(it,side){
  var ph=isPh(it),lvI=LV.indexOf(it.lv);
  var seen={};seen[it[side]]=1;
  var pool=shuffle(L().all.filter(function(x){return x.id!==it.id&&isPh(x)===ph;}));
  pool.sort(function(a,b){return Math.abs(LV.indexOf(a.lv)-lvI)-Math.abs(LV.indexOf(b.lv)-lvI);});
  var out=[];
  for(var i=0;i<pool.length&&out.length<3;i++){var v=pool[i][side];if(!seen[v]){seen[v]=1;out.push({v:v,c:false});}}
  return out;
}
function mkFill(it){
  var tk=it.t.split(" "),c=[];
  tk.forEach(function(w,i){var core=w.replace(/^[¿¡]+/,"").replace(/[,.?!]+$/,"");if(core.length>=3)c.push(i);});
  if(!c.length)return null;
  var idx=c[Math.floor(Math.random()*c.length)],w=tk[idx];
  var lead=(w.match(/^[¿¡]+/)||[""])[0],trail=(w.match(/[,.?!]+$/)||[""])[0],core=w.slice(lead.length,w.length-trail.length);
  var pre=tk.slice(0,idx).join(" ")+(idx?" ":"")+lead;
  var post=trail+(idx<tk.length-1?" ":"")+tk.slice(idx+1).join(" ");
  var seen={};seen[loose(core)]=1;var pool=[];
  L().all.forEach(function(x){if(isPh(x))x.t.split(" ").forEach(function(y){var k=y.replace(/^[¿¡]+/,"").replace(/[,.?!]+$/,"");if(k.length>=3&&!seen[loose(k)]){seen[loose(k)]=1;pool.push(k);}});});
  var opts=[{v:core,c:true}].concat(shuffle(pool).slice(0,3).map(function(v){return {v:v,c:false};}));
  return {pre:pre,post:post,core:core,opts:shuffle(opts)};
}
function startG(cfg,steps){
  G={cfg:cfg,queue:steps,total:steps.filter(function(s){return s.k==="q";}).length,done:0,hearts:5,ok1:0,n1:0,t0:Date.now()};
  LAST={mode:cfg.mode,cfg:cfg};view="game";goalHit=false;initStep();
}
function beginSession(cfg){
  var items=shuffle(cfg.items.slice()),steps=[];
  for(var i=0;i<items.length;i+=4){
    var ch=items.slice(i,i+4);
    if(cfg.mode==="unit")ch.forEach(function(it){if(rec(it).box===0)steps.push({k:"intro",it:it});});
    shuffle(ch.slice()).forEach(function(it){steps.push({k:"q",it:it,type:pickType(it)});});
  }
  if(cfg.mode==="unit"&&cfg.unit.note&&!S.done[cfg.unit.id])steps.unshift({k:"note",text:cfg.unit.note});
  startG(cfg,steps);
}
function startList(mode){

}
function startMonster(){

  var p=shuffle(pool.slice()),steps=[];

function startFill(){
  var p=shuffle(seenItems().filter(isPh));if(p.length<4)return;
  startG({mode:"fill"},p.slice(0,8).map(function(it){return {k:"q",it:it,type:"fill"};}));

function startConj(vi){
  var sel=cjSel(),cj=L().conj,now=Date.now(),cand=[];
  var verbs=vi==null?cj.map(function(_,i){return i;}):[vi];
  verbs.forEach(function(v){sel.forEach(function(tk){for(var p=0;p<6;p++)cand.push({v:v,tk:tk,p:p,id:"cj:"+S.lang+":"+cj[v].v+":"+tk+":"+p});});});
  var due=cand.filter(function(c){var r=S.items[c.id];return r&&r.box>=1&&r.due<=now;}).sort(function(a,b){return S.items[a.id].due-S.items[b.id].due;});
  var fresh_=cand.filter(function(c){return !S.items[c.id];});
  if(vi==null){var vo={};fresh_.forEach(function(c){vo[c.v]=1;});var firstVerbs=Object.keys(vo).map(Number).sort(function(a,b){return a-b;}).slice(0,3);fresh_=fresh_.filter(function(c){return firstVerbs.indexOf(c.v)>-1;});}
  fresh_=shuffle(fresh_);
  var rest=shuffle(cand.filter(function(c){return S.items[c.id]&&due.indexOf(c)<0;}));
  var pick=due.slice(0,8);
  fresh_.concat(rest).forEach(function(c){if(pick.length<12&&pick.indexOf(c)<0)pick.push(c);});
  var steps=shuffle(pick).map(function(c){var it=cjItem(c.v,c.tk,c.p);return {k:"q",it:it,type:pickType(it)};});

function initStep(){
  var st=G.queue[0];G.cur=st;G.sel=null;G.built=[];G.reveal=false;G.res=null;
  G.phase=(st.k==="intro"||st.k==="note")?"intro":"ask";
  if(st.k==="q"){
    var it=st.it;
    if(st.type==="fill"){st.fill=mkFill(it);if(!st.fill)st.type="build";else st.opts=st.fill.opts;}
    if(st.type==="mc"){st.opts=shuffle([{v:it.a,c:true}].concat(distract(it,"a")));}
    else if(st.type==="mcr"||st.type==="listen"){st.opts=shuffle([{v:it.t,c:true}].concat(distract(it,"t")));}
    else if(st.type==="cmc"){st.opts=shuffle([{v:it.f,c:true}].concat(cjDistract(it)));}
    else if(st.type==="build"){
      var mk=function(){return shuffle(it.t.split(" ").map(function(w,i){return {w:w,i:i};}));};
      st.bank=mk();
      if(st.bank.length>1&&st.bank.every(function(b,i){return b.i===i;}))st.bank=mk();
    }
  }
  render();window.scrollTo(0,0);
  if(st.k==="intro"||(st.k==="q"&&(st.type==="listen"||st.type==="dict")))setTimeout(function(){speak(st.it.t);},120);
}
function grade(it,ok){
  var r=S.items[it.id]||(S.items[it.id]={box:0,due:0,seen:0,wrong:0});
  r.seen=(r.seen||0)+1;
  var days=[0,0.007,1,3,7,21];
  if(ok){r.box=Math.min(5,r.box+1);r.due=Date.now()+days[r.box]*864e5;}
  else{r.box=Math.max(0,r.box-2);r.due=Date.now();r.wrong=(r.wrong||0)+1;}
  logAns(ok);
}
function check(){
  var st=G.cur,it=st.it,ok=false,note="";
  if(st.type==="type"||st.type==="dict"){
    var v=document.getElementById("ans").value;
    ok=loose(v)===loose(it.t);
    if(ok&&norm(v)!==norm(it.t))note="صح، بس الشكل الصحيح: "+it.t;
  }else if(st.type==="ctype"){
    var w=norm(document.getElementById("ans").value);
    if(w===norm(it.f)||w===norm(it.t))ok=true;
    else if(loose(w)===loose(it.f)||loose(w)===loose(it.t)){ok=true;note="صح، بس خلي بالك من العلامات: "+it.f;}
  }else if(st.type==="build"){
    ok=loose(G.built.map(function(i){return st.bank[i].w;}).join(" "))===loose(it.t);
  }else ok=st.opts[G.sel].c;
  if(!st.retry){grade(it,ok);G.n1++;if(ok)G.ok1++;}
  if(ok)G.done++;
  else{G.hearts--;G.queue.push({k:"q",it:it,type:st.type==="type"?"mcr":st.type==="dict"?"listen":st.type==="ctype"?"cmc":st.type,retry:true});}
  G.phase="fb";G.res={ok:ok,note:note};
  save();render();
  if(st.type!=="listen")speak(it.t);
}
function next(){
  if(G.phase==="intro"){G.queue.shift();initStep();return;}
  if(G.hearts<=0){addXP(G.ok1*5);addTime(G.t0);save();view="fail";render();return;}
  G.queue.shift();
  if(!G.queue.length)finish();else initStep();
}
function finish(){
  var m=G.cfg.mode,acc=G.n1?Math.round(100*G.ok1/G.n1):100;
  var gained=G.ok1*10+10+(G.ok1===G.n1?20:0)+(m==="monster"?20:0);
  addXP(gained);touchStreak();addTime(G.t0);pruneLog();
  if(m==="unit")S.done[G.cfg.unit.id]=Math.max(S.done[G.cfg.unit.id]||1,acc);
  save();
  var T={unit:"خلّصت الوحدة!",review:"خلّصت المراجعة!",weak:"خلّصت التدريب!",missed:"خلّصت تدريب الغلطات!",monster:"هزمت الوحش!",fill:"خلّصت ملء الفراغ!",conj:"خلّصت تدريب التصريف!"};

function matchTap(s,id){

function wlistHTML(){
  var q=loose(WF.q),qa=WF.q.trim(),f=WF.f;
  var list=L().all.filter(function(it){
    var r=S.items[it.id],seen=r&&r.seen>0,box=r?r.box:0;
    if(f==="mastered"&&!(seen&&box>=3))return false;
    if(f==="learning"&&!(seen&&box<3))return false;
    if(f==="weak"&&!(seen&&box<=2&&(r.wrong||0)>0))return false;
    if(f==="new"&&seen)return false;
    if(qa&&loose(it.t).indexOf(q)<0&&it.a.indexOf(qa)<0)return false;
    return true;
  });
  if(!list.length)return '<p class="empty">مفيش كلمات هنا دلوقتي</p>';
  return '<div class="wl">'+list.slice(0,300).map(function(it){
    var b=rec(it).box,d="";for(var i=1;i<=5;i++)d+='<i'+(i<=b?' class="on"':'')+'></i>';
    return '<div class="wrow"><div class="txt"><div class="t">'+esc(it.t)+'</div><div class="a">'+esc(it.a)+'</div></div><span class="lvb">'+it.lv+'</span><div class="dots" title="درجة الإتقان">'+d+'</div>'
      +'<button class="spk" data-act="speak" data-t="'+esc(it.t)+'" aria-label="استمع">'+ico("spk")+'</button></div>';
  }).join("")+'</div>'+(list.length>300?'<p class="empty">بيظهر أول 300. استخدم البحث للباقي.</p>':'');
}

  var h='<div class="wrap">'+back('قراءة واستماع · '+L().name)+'<p class="lead">كل نص فيه كلمات مساعدة وتلات أسئلة فهم. تقدر تسمعه الأول من غير ما تشوف الكلام كتدريب استماع.</p>';
  LV.forEach(function(lv){
    var ts=L().read.map(function(t,i){return {t:t,i:i};}).filter(function(x){return x.t.lv===lv;});
    if(!ts.length)return;
    h+='<div class="lv-head" style="margin-top:22px"><span class="lv-code" style="font-size:1.5rem">'+lv+'</span><span class="lv-name">'+LV_AR[lv]+'</span></div><div class="units">';
    ts.forEach(function(x){var sc=S.rd[S.lang+"-"+x.i];
      h+='<button class="unit'+(sc===x.t.qs.length?' done':'')+'" data-act="rtext" data-i="'+x.i+'"><div class="row"><strong>'+esc(x.t.title)+'</strong>'+(sc===x.t.qs.length?ico("check","c-ok"):'')+'</div><span>'+x.t.text.split(/\s+/).length+' كلمة · '+x.t.qs.length+' أسئلة</span><span class="go">'+(sc!=null?'نتيجتك '+sc+'/'+x.t.qs.length:'اقرا')+'</span></button>';});
    h+='</div>';
  });
  return h+'</div>';
}
function rtextView(){
  var t=L().read[RD.i];

    +'<div class="ractions"><button class="btn ghost sm" data-act="speak" data-t="'+esc(t.text)+'">'+ico("spk")+' اسمع النص</button><button class="btn ghost sm" data-act="speakslow" data-t="'+esc(t.text)+'">ببطء</button><button class="btn ghost sm" data-act="rhide">'+(RD.hide?'اعرض النص':'خبّي النص (استماع)')+'</button></div>'
    +(RD.hide?'<div class="rtext hidden">النص مخفي. اسمعه وجاوب الأسئلة.</div>':'<div class="rtext ltr" lang="'+S.lang+'">'+esc(t.text)+'</div>')
    +'<div class="gloss">'+t.gl.map(function(g){var p=g.split("|");return '<span><b class="ltr">'+esc(p[0])+'</b> '+esc(p[1])+'</span>';}).join("")+'</div>';
  t.qs.forEach(function(q,qi){
    h+='<div class="rq"><p>'+(qi+1)+'. '+esc(q[0])+'</p><div class="opts">';
    q[1].forEach(function(o,oi){var c="opt";
      if(RD.done){if(oi===q[2])c+=" right";else if(RD.ans[qi]===oi)c+=" wrong";}else if(RD.ans[qi]===oi)c+=" sel";
      h+='<button class="'+c+'" data-act="rans" data-q="'+qi+'" data-o="'+oi+'"'+(RD.done?' disabled':'')+'>'+esc(o)+'</button>';});

  });

  if(!RD.done)h+='<div class="fbbar"><button class="btn" data-act="rcheck"'+(all?'':' disabled')+'>تحقق</button></div>';
  else h+='<div class="fbbar '+(RD.ok===t.qs.length?'ok':'no')+'"><h3>'+RD.ok+' من '+t.qs.length+' صح</h3><p>+'+RD.gained+' نقطة خبرة</p><div class="acts two"><button class="btn" data-act="read">نص تاني</button><button class="btn ghost" data-act="rtext" data-i="'+RD.i+'">اقرا تاني</button></div></div>';

/* grammar */

  var F=[["all","الكل"]].concat(LV.map(function(l){return [l,l];}));
  var h='<div class="wrap">'+back('القواعد · '+L().name)
    +'<div class="chips" style="margin-top:14px">'+F.map(function(x){return '<button class="chip" data-act="gf" data-f="'+x[0]+'" aria-pressed="'+(GF.lv===x[0])+'">'+x[1]+'</button>';}).join("")+'</div>';
  LV.forEach(function(lv){
    if(GF.lv!=="all"&&GF.lv!==lv)return;

/* stats */
var DAYS_AR=["الحد","الاتنين","التلات","الأربع","الخميس","الجمعة","السبت"];
function lastDays(n,offset){var a=[];for(var i=n-1;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i-(offset||0));a.push({d:d,k:dstr(d)});}return a;}
function sumDays(ds){var o={x:0,q:0,o:0,s:0,act:0};ds.forEach(function(x){var l=dayLog(x.k);o.x+=l.x;o.q+=l.q;o.o+=l.o;o.s+=l.s;if(l.x>0||l.q>0)o.act++;});return o;}
function weekChart(){
  var ds=lastDays(7),g=S.goal||50,vals=ds.map(function(x){return dayLog(x.k).x;});
  var max=Math.max(g,Math.max.apply(null,vals));max=Math.ceil(max*1.15/10)*10||10;
  var W=340,H=190,pl=8,pr=8,pt=22,pb=34,cw=(W-pl-pr)/7,bw=Math.min(30,cw*.58),ch=H-pt-pb;
  var y=function(v){return pt+ch-ch*v/max;};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="نقاط الخبرة آخر 7 أيام">';
  s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(0)+'" y2="'+y(0)+'" class="axis"/>';
  s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(g)+'" y2="'+y(g)+'" class="goalline"/><text x="'+(W-pr)+'" y="'+(y(g)-5)+'" text-anchor="end" class="glab">الهدف '+g+'</text>';
  ds.forEach(function(x,i){
    var v=vals[i],cx=pl+cw*i+cw/2,top=y(v),isT=i===6,hit=v>=g;
    if(v>0)s+='<rect x="'+(cx-bw/2)+'" y="'+top+'" width="'+bw+'" height="'+Math.max(2,y(0)-top)+'" rx="5" class="bar'+(hit?' hit':'')+(isT?' today':'')+'"/>';
    s+='<text x="'+cx+'" y="'+(v>0?top-6:y(0)-6)+'" text-anchor="middle" class="val">'+v+'</text>';
    s+='<text x="'+cx+'" y="'+(H-12)+'" text-anchor="middle" class="day'+(isT?' t':'')+'">'+(isT?'النهارده':DAYS_AR[x.d.getDay()])+'</text>';
  });
  return s+'</svg>';
}
function fmtMin(s){var m=Math.round(s/60);return m<60?m+' د':Math.floor(m/60)+' س '+(m%60)+' د';}
function cmp(a,b){if(!b)return a?'<span class="up">جديد</span>':'';var d=Math.round(100*(a-b)/b);return d===0?'<span class="dim">زي اللي فاتت</span>':'<span class="'+(d>0?'up':'down')+'">'+(d>0?'+':'')+d+'%</span>';}
function statsView(){
  var w=sumDays(lastDays(7)),pw=sumDays(lastDays(7,7));
  var acc=w.q?Math.round(100*w.o/w.q):0,pacc=pw.q?Math.round(100*pw.o/pw.q):0;
  var h='<div class="wrap">'+back('الإحصائيات · '+L().name);
  h+='<div class="panel"><div class="ph"><h3>آخر 7 أيام</h3><span class="dim">'+w.act+' من 7 أيام اتدربت فيهم</span></div>'+weekChart()
    +'<div class="kpis"><div><small>نقاط خبرة</small><b>'+w.x+'</b>'+cmp(w.x,pw.x)+'</div><div><small>إجابات</small><b>'+w.q+'</b>'+cmp(w.q,pw.q)+'</div><div><small>الدقة</small><b>'+(w.q?acc+'%':'–')+'</b>'+(w.q&&pw.q?'<span class="'+(acc>=pacc?'up':'down')+'">'+(acc>=pacc?'+':'')+(acc-pacc)+' نقطة</span>':'')+'</div><div><small>وقت التدريب</small><b>'+fmtMin(w.s)+'</b>'+cmp(w.s,pw.s)+'</div></div>'
    +'<p class="hint" style="text-align:start;margin-top:10px">الأرقام بالمقارنة بالأسبوع اللي قبله.</p></div>';
  h+='<div class="panel"><div class="ph"><h3>الهدف اليومي</h3><span class="dim">أطول سلسلة: '+(S.bestStreak||curStreak())+' يوم</span></div><div class="chips">'
    +[20,50,100,150].map(function(g){return '<button class="chip" data-act="goal" data-g="'+g+'" aria-pressed="'+(S.goal===g)+'">'+g+' نقطة'+(g===20?' · خفيف':g===50?' · عادي':g===100?' · جد':' · مكثف')+'</button>';}).join("")+'</div></div>';
  h+='<div class="panel"><div class="ph"><h3>التقدّم في المستويات</h3><span class="dim">كلمات متقنة</span></div><div class="lvbars">';
  LV.forEach(function(lv){var all=L().all.filter(function(i){return i.lv===lv;}),m=mastered(all),p=Math.round(100*m/all.length);
    h+='<div class="lvb2"><span class="ltr">'+lv+'</span><span class="track"><i style="width:'+p+'%"></i></span><span class="num">'+m+'/'+all.length+'</span></div>';});
  h+='</div></div>';
  var miss=missedList().slice(0,10);
  h+='<div class="panel"><div class="ph"><h3>أكتر الكلمات اللي بتغلط فيها</h3></div>';
  if(!miss.length)h+='<p class="empty">لسه مفيش غلطات متسجلة. أول ما تغلط في كلمة هتظهر هنا.</p>';
  else{var mx=rec(miss[0]).wrong;
    h+='<div class="miss">'+miss.map(function(it){var r=rec(it);return '<div class="mrow"><div class="txt"><div class="t ltr">'+esc(it.t)+'</div><div class="a">'+esc(it.a)+'</div></div><span class="mbar"><i style="width:'+Math.round(100*r.wrong/mx)+'%"></i></span><span class="mn">'+r.wrong+'×</span><button class="spk" data-act="speak" data-t="'+esc(it.t)+'" aria-label="استمع">'+ico("spk")+'</button></div>';}).join("")+'</div>'
      +'<div style="height:12px"></div><button class="btn" data-act="missgo">تدرّب على الكلمات دي</button>';}
  h+='</div>';
  var cs=cjStats(),tk=L().tenses.filter(function(t){return cs[t[0]]&&cs[t[0]].seen;});
  h+='<div class="panel"><div class="ph"><h3>دقة التصريف حسب الزمن</h3></div>';
  if(!tk.length)h+='<p class="empty">ابدأ تدريب التصريف وهتظهر دقتك في كل زمن هنا.</p>';
  else{h+='<div class="lvbars">'+tk.map(function(t){var c=cs[t[0]],a=Math.max(0,Math.round(100*(c.seen-c.wrong)/c.seen));return '<div class="lvb2 wide"><span>'+t[1]+'</span><span class="track'+(a<70?' warn':'')+'"><i style="width:'+a+'%"></i></span><span class="num">'+a+'%</span></div>';}).join("")+'</div>';}
  return h+'</div></div>';
}

var VIEWS={home:homeView,game:gameView,result:resultView,fail:failView,race:raceView,match:matchView,words:wordsView,backup:backupView,conj:conjView,ctable:ctableView,read:readView,rtext:rtextView,grammar:grammarView,stats:statsView};
function render(){
  var app=document.getElementById("app");
  app.innerHTML=(VIEWS[view]||homeView)();
  var inp=document.getElementById("ans");
  if(inp&&G&&G.phase==="ask"&&view==="game"){
    inp.focus();lastField=inp;
    inp.addEventListener("input",function(){var b=document.getElementById("chk");if(b)b.disabled=!inp.value.trim();});
  }
  if(view!==lastView){window.scrollTo(0,0);lastView=view;}
}
function goHome(){
  if(view==="game"&&G)addTime(G.t0);
  if(view==="race"&&R)addTime(R.t0);
  if(view==="match"&&M)addTime(M.t0);
  stopRace();view="home";G=null;resetArm=false;save();render();
}
function bkmsg(t,bad){var e=document.getElementById("bkmsg");if(e){e.textContent=t;e.style.color=bad?"var(--bad)":"var(--good)";}}

/* ---------- events ---------- */
var app=document.getElementById("app");
app.addEventListener("mousedown",function(e){if(e.target.closest(".accs button"))e.preventDefault();});
app.addEventListener("focusin",function(e){if(e.target.tagName==="INPUT"&&e.target.classList.contains("field"))lastField=e.target;});
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  var a=b.dataset.act;
  if(a==="lang"){S.lang=b.dataset.v;save();render();}
  else if(a==="unit"){var u=L().units.find(function(x){return x.id===b.dataset.u;});beginSession({mode:"unit",unit:u,items:u.items});}
  else if(a==="review"){startList("review");}
  else if(a==="weakgo"){startList("weak");}
  else if(a==="missgo"){startList("missed");}
  else if(a==="monster"){startMonster();}
  else if(a==="race"){startRace();}
  else if(a==="match"){startMatch();}
  else if(a==="fill"){startFill();}
  else if(a==="words"||a==="backup"||a==="conj"||a==="read"||a==="grammar"||a==="stats"){view=a;render();}
  else if(a==="unlock"){S.open=!S.open;save();render();}
  else if(a==="speak"){speak(b.dataset.t);}
  else if(a==="speakslow"){speak(b.dataset.t,.6);}
  else if(a==="snd"){S.sound=!S.sound;save();if(!S.sound&&canSpeak)try{speechSynthesis.cancel();}catch(x){}render();}
  else if(a==="quit"||a==="home"){goHome();}
  else if(a==="again"){again();}
  else if(a==="next"){next();}
  else if(a==="check"){check();}
  else if(a==="reveal"){G.reveal=true;var keep=document.getElementById("ans");var kv=keep?keep.value:"";render();var k2=document.getElementById("ans");if(k2){k2.value=kv;var c0=document.getElementById("chk");if(c0)c0.disabled=!kv.trim();}}
  else if(a==="wf"){WF.f=b.dataset.f;render();}
  else if(a==="gf"){GF.lv=b.dataset.f;render();}
  else if(a==="goal"){S.goal=+b.dataset.g;save();render();}
  else if(a==="mt"){matchTap(b.dataset.s,b.dataset.id);}
  else if(a==="cjt"){
    var sel=cjSel().slice(),t=b.dataset.t,ix=sel.indexOf(t);
    if(ix>-1)sel.splice(ix,1);else sel.push(t);
    sel=L().tenses.map(function(x){return x[0];}).filter(function(k){return sel.indexOf(k)>-1;});
    if(!S.cjSel)S.cjSel={};S.cjSel[S.lang]=sel.length?sel:[t];save();render();
  }
  else if(a==="cjgo"){startConj(null);}
  else if(a==="vtab"){openTable(+b.dataset.i);}
  else if(a==="ctt"){CT.tk=b.dataset.t;CT.mode="learn";CT.res=null;CT.vals=["","","","","",""];render();}
  else if(a==="ctquiz"){CT.mode="quiz";CT.res=null;CT.vals=["","","","","",""];render();var f0=document.getElementById("ct0");if(f0)f0.focus();}
  else if(a==="ctlearn"){CT.mode="learn";CT.res=null;render();}
  else if(a==="ctcheck"){checkTable();}
  else if(a==="cjverb"){startConj(CT.vi);}
  else if(a==="rtext"){openRead(+b.dataset.i);}
  else if(a==="rhide"){RD.hide=!RD.hide;render();}
  else if(a==="rans"){if(!RD.done){RD.ans[+b.dataset.q]=+b.dataset.o;render();}}
  else if(a==="rcheck"){checkRead();}
  else if(a==="acc"){
    var f=(document.activeElement&&document.activeElement.tagName==="INPUT")?document.activeElement:lastField;
    if(!f||!document.body.contains(f)||f.disabled)return;
    var s=f.selectionStart==null?f.value.length:f.selectionStart,te=f.selectionEnd==null?s:f.selectionEnd;
    f.value=f.value.slice(0,s)+b.dataset.c+f.value.slice(te);
    f.focus();f.setSelectionRange(s+1,s+1);
    var c=document.getElementById("chk");if(c&&f.id==="ans")c.disabled=!f.value.trim();
  }
  else if(a==="ropt"){
    if(!R||R.lock)return;
    R.lock=true;R.sel=+b.dataset.i;
    var ok=R.q.opts[R.sel].c;
    if(ok){R.score++;logAns(true);}else{R.wrong++;R.pen+=3;grade(R.q.it,false);save();}
    render();
    setTimeout(function(){if(view!=="race"||!R)return;raceQ();render();},ok?180:700);
  }
  else if(a==="bkcopy"){
    var tx=document.getElementById("bk-out");tx.focus();tx.select();
    try{navigator.clipboard.writeText(tx.value).then(function(){S.bk=Date.now();save();bkmsg("اتنسخ. احفظه في ملاحظاتك أو ابعته لنفسك.");},function(){bkmsg("حدّد الكود وانسخه يدوي.",true);});}
    catch(x){bkmsg("حدّد الكود وانسخه يدوي.",true);}
  }
  else if(a==="bkimport"){
    var v=document.getElementById("bk-in").value.trim();
    try{
      var o=JSON.parse(decodeURIComponent(escape(atob(v))));
      if(!o||typeof o!=="object"||!o.items||typeof o.items!=="object")throw new Error("bad");
      S=Object.assign(fresh(),o);save();bkmsg("تم الاستيراد. تقدّمك رجع.");
    }catch(x){bkmsg("الكود مش صحيح. اتأكد إنك نسخته كامل.",true);}
  }
  else if(a==="reset"){
    if(!resetArm){resetArm=true;render();}
    else{S=fresh();save();resetArm=false;goHome();}
  }
  else if(G&&G.phase==="ask"&&view==="game"){
    if(a==="opt"){G.sel=+b.dataset.i;render();}
    else if(a==="build"){G.built.push(+b.dataset.i);render();}
    else if(a==="unbuild"){G.built.splice(+b.dataset.p,1);render();}
  }
});
app.addEventListener("input",function(e){
  if(e.target.id==="wq"){WF.q=e.target.value;var l=document.getElementById("wlist");if(l)l.innerHTML=wlistHTML();}
});
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter"||e.target.tagName==="BUTTON"||e.target.tagName==="TEXTAREA")return;
  if(view==="game"){
    var b=document.querySelector('[data-act="check"],[data-act="next"]');
    if(b&&!b.disabled){e.preventDefault();b.click();}
  }else if(view==="ctable"&&CT&&CT.mode==="quiz"&&!CT.res&&e.target.id&&e.target.id.indexOf("ct")===0){
    e.preventDefault();var n=+e.target.id.slice(2)+1,nx=document.getElementById("ct"+n);
    if(nx)nx.focus();else checkTable();
  }
});

/* ---------- cloud sync (per-viewer private docs) ---------- */
var CL={db:null,uid:null,on:false,last:{},timer:null,busy:false,dirty:false};
function cloudParts(){
  var core={},fr={},es={};
  Object.keys(S).forEach(function(k){if(k!=="items")core[k]=S[k];});
  Object.keys(S.items).forEach(function(id){
    var r=S.items[id],arr=[r.box||0,Math.round((r.due||0)/1000),r.seen||0,r.wrong||0];
    (id.indexOf("es-")===0||id.indexOf("cj:es:")===0?es:fr)[id]=arr;
  });
  return {core:JSON.stringify(core),fr:JSON.stringify(fr),es:JSON.stringify(es)};
}
function cdoc(name){return CL.db.doc("data/users/"+CL.uid+"/"+name);}
function cloudSchedule(){if(!CL.on)return;if(CL.timer)clearTimeout(CL.timer);CL.timer=setTimeout(cloudPush,2500);}
function cloudPush(){
  if(!CL.on)return;
  if(CL.busy){CL.dirty=true;return;}
  CL.busy=true;CL.dirty=false;
  var parts=cloudParts(),ts=S.ts||Date.now(),names=["fr","es","core"],i=0;
  function step(){
    if(i>=names.length){CL.busy=false;if(CL.dirty)cloudSchedule();return;}
    var n=names[i++];
    if(parts[n]===CL.last[n]){step();return;}
    cdoc(n).set({s:parts[n],ts:ts}).then(function(){CL.last[n]=parts[n];step();},function(err){
      CL.busy=false;
      if(err&&(err.code==="revoked"||err.code==="invalid_argument"||err.code==="not_granted")){CL.on=false;}
      else if(err&&err.code==="unavailable"){setTimeout(cloudSchedule,4000);}
    });
  }
  step();
}
function cloudInit(){
  if(!window.claude||typeof window.claude.use!=="function")return;
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    var db=r[0],user=r[1];if(!db||!user)return null;
    return user.id().then(function(uid){
      if(!uid)return null;CL.db=db;CL.uid=uid;
      return cdoc("core").get().then(function(snap){
        var d=snap.exists?snap.data():null;
        if(d&&typeof d.s==="string"&&(!HAD_LOCAL||(d.ts||0)>(S.ts||0))){
          return Promise.all([cdoc("fr").get(),cdoc("es").get()]).then(function(ps){
            var S2=Object.assign(fresh(),JSON.parse(d.s));S2.items={};
            CL.last.core=d.s;
            ps.forEach(function(p,ix){
              var dd=p.exists?p.data():null;if(!dd||typeof dd.s!=="string")return;
              CL.last[ix?"es":"fr"]=dd.s;
              var m=JSON.parse(dd.s);Object.keys(m).forEach(function(id){var a=m[id];S2.items[id]={box:a[0],due:a[1]*1000,seen:a[2],wrong:a[3]};});
            });
            S=S2;saveLocal();CL.on=true;
            if(view==="home"||view==="stats"||view==="words"||view==="conj"||view==="read")render();
          });
        }
        CL.on=true;cloudPush();if(view==="home")render();
      });
    });
  }).catch(function(){CL.on=false;});
}
render();
cloudInit();

})();
</script>
